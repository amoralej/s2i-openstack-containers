[tox]
envlist = linters,update-sources,build,test
skipsdist = true

[testenv]
passenv =
    STREAM
    REGISTRY
    NAMESPACE
    TAG
    IMAGE_PREFIX
    BASE_IMAGE
    CONSTRAINTS_FILE
    BUILD_CONSTRAINTS_FILE
    DEFAULT_STREAM
    SKIP_HASH_UPDATE
    PIP_NO_BINARY
    REGISTRY_AUTH_FILE
    PARALLEL
    BUILD_LOGS_DIR
# pin to pip==26.1.2 as 26.2 has broken pip-tools
deps =
    pip-tools
    pybuild-deps
    pip==26.1.2
allowlist_externals =
    bash

[testenv:linters]
description = Lint all Containerfiles with pre-commit (hadolint)
deps =
    pre-commit>=3.0.0
commands =
    pre-commit run --all-files --show-diff-on-failure {posargs}

[testenv:update-sources]
commands =
    bash {toxinidir}/build.sh update-sources all

[testenv:build]
commands =
    bash {toxinidir}/build.sh build all

[testenv:test]
commands =
    bash {toxinidir}/tests/test_update_sources.sh

[testenv:custom]
commands =
    bash {toxinidir}/build.sh {posargs}
